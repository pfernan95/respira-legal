# Static SEO audit (tools/seo-audit.mjs) on every pull request: titles,
# descriptions, canonicals, sitemap, hreflang, anchor text, alt text and
# structured data, against Google's SEO Starter Guide. Kept out of the daily
# deploy on purpose — a data refresh must never be blocked by it.
name: seo-audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run seo
